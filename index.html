<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bản Tin Gọn</title>
<meta name="description" content="Bản tin gọn 4 lần mỗi ngày: AI, tin trong nước, tài chính, kinh doanh và kiến thức thực tiễn.">
<meta name="theme-color" content="#efe7d4">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bản Tin Gọn">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Trang báo giấy: nền giấy in, mực đen, đường kẻ đôi dưới tên báo; mỗi tin = ảnh lớn phía trên, chữ bên dưới, ngăn cách bằng đường kẻ mảnh. */
:root{
  --paper:#efe7d4;      /* giấy in báo */
  --paper-deep:#e6dcc4; /* ô số liệu, nền ảnh */
  --ink:#1d1a16;        /* mực */
  --muted:#5e554a;
  --rule:#b9ab90;       /* đường kẻ */
  --red:#9b2b1f;        /* mực đỏ nhãn mảng */
  --up:#2f6b2a;--down:#9b2b1f;
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(rgba(60,45,20,.045) 1px,transparent 1px);background-size:3px 3px}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
.masthead{text-align:center;border-bottom:4px double var(--ink);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,8vw,2.8rem);letter-spacing:.02em;margin:0;line-height:1.1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
button.chip{font:inherit;font-size:.82rem;border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:4px 12px;border-radius:2px;cursor:pointer;font-variant-numeric:tabular-nums}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button.chip:disabled{opacity:.35;cursor:default}
button.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li.item{display:flex;flex-direction:column;gap:12px;padding-block:22px;border-bottom:1px solid var(--rule)}
li.item:first-child{padding-top:4px}
.pic{margin:0;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--paper-deep);overflow:hidden;border:1px solid var(--rule)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.12) contrast(1.02)}
.fig{background:var(--paper-deep);border:1px solid var(--rule);padding:18px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.fig .num{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig .big{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-word}
.fig .small{font-size:.8rem;color:var(--muted);line-height:1.35}
.fig .delta{font-family:var(--f-mono);font-size:.8rem}
.fig .delta.up{color:var(--up)}.fig .delta.down{color:var(--down)}
.fig .spk{flex:1 1 180px;min-width:0;color:var(--ink)}
.fig .spk svg{width:100%;height:auto;display:block}
.fig svg.g{width:56px;height:56px;color:var(--ink);flex:none}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.cat{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--red)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.3;margin:0;text-wrap:balance}
p.sum{margin:0;font-size:.98rem}
a.src{font-size:.82rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);align-self:flex-start}
a.src:hover{text-decoration-color:var(--ink)}
a.src:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.end{text-align:center;color:var(--muted);font-size:.9rem;padding-top:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.end .mark{font-family:var(--f-display);font-weight:700;letter-spacing:.3em;color:var(--ink)}
.empty{border:1px dashed var(--rule);padding:28px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead"><h1>Bản Tin Gọn</h1></header>
  <div class="row" id="cats" role="group" aria-label="Lọc theo mảng"></div>
  <ol class="items" id="items"></ol>
  <div class="empty" id="empty" hidden>Chưa có bản tin nào.</div>
  <div class="end" id="end" hidden><span class="mark">— HẾT —</span><span>Vậy là đủ cho lúc này. Hẹn bản sau.</span></div>
</div>
<script>
const CATS={ai:"Công nghệ AI",vn:"Trong nước",fin:"Tài chính",biz:"Kinh doanh · Startup",know:"Kiến thức thực tiễn"};
const G={
ai:'<rect x="16" y="16" width="32" height="32" rx="6"/><rect x="26" y="26" width="12" height="12" rx="2" fill="currentColor"/><path d="M24 8v8M32 8v8M40 8v8M24 48v8M32 48v8M40 48v8M8 24h8M8 32h8M8 40h8M48 24h8M48 32h8M48 40h8"/>',
vn:'<path d="M10 54h44M14 54V30M24 54V30M40 54V30M50 54V30M8 30h48L32 12z"/>',
fin:'<path d="M8 50l14-14 10 8 22-24"/><path d="M42 20h12v12"/>',
biz:'<rect x="8" y="22" width="48" height="32" rx="4"/><path d="M24 22v-6a4 4 0 014-4h8a4 4 0 014 4v6M8 36h48"/>',
know:'<path d="M32 8a16 16 0 00-9 29v7h18v-7A16 16 0 0032 8zM24 52h16M27 58h10"/>'};
const $=id=>document.getElementById(id);
let items=[],cat="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:"#"}catch(e){return "#"}};
function spark(v){const n=v.length;if(n<2)return"";const w=200,h=56,p=4,mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pt=v.map((x,i)=>[p+i*(w-2*p)/(n-1),h-p-(x-mn)/r*(h-2*p)]);const d=pt.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");const l=pt[n-1];
  return `<div class="spk"><svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${l[0]} ${h} L${pt[0][0]} ${h}Z" fill="currentColor" opacity=".08"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="currentColor"/></svg></div>`}
function fig(it){const f=it.figure;
  if(f&&f.value){const dir=f.dir==="up"?"up":f.dir==="down"?"down":"";const ar=dir==="up"?"▲ ":dir==="down"?"▼ ":"";
    return `<div class="fig"><div class="num"><div class="big">${esc(f.value)}</div>${f.delta?`<div class="delta ${dir}">${ar}${esc(f.delta)}</div>`:""}${f.label?`<div class="small">${esc(f.label)}</div>`:""}</div>${Array.isArray(f.spark)?spark(f.spark.map(Number).filter(isFinite)):""}</div>`}
  return `<div class="fig"><svg class="g" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">${G[it.cat]||G.know}</svg>${it.tag?`<div class="num"><div class="small">${esc(it.tag)}</div></div>`:""}</div>`}
function visual(it,i){if(it.image&&safe(it.image)!=="#")return `<figure class="pic" data-i="${i}"><img src="${esc(safe(it.image))}" alt="" loading="lazy" referrerpolicy="no-referrer"></figure>`;return fig(it)}
function render(){
  if(!items.length){$("empty").hidden=false;return}
  if(cat!=="all"&&!items.some(i=>i.cat===cat))cat="all";
  const cs=$("cats");cs.innerHTML="";
  [["all","Tất cả"],...Object.entries(CATS)].forEach(([k,n])=>{const c=k==="all"?items.length:items.filter(i=>i.cat===k).length;
    const b=document.createElement("button");b.className="chip";b.textContent=`${n} ${c}`;b.disabled=c===0&&k!=="all";b.setAttribute("aria-pressed",String(cat===k));b.onclick=()=>{cat=k;render()};cs.appendChild(b)});
  const sh=cat==="all"?items:items.filter(i=>i.cat===cat);
  $("items").innerHTML=sh.map((it,i)=>`<li class="item">${visual(it,i)}<div class="body"><span class="cat">${esc(CATS[it.cat]||CATS.know)}</span><h2>${esc(it.title)}</h2><p class="sum">${esc(it.summary)}</p><a class="src" href="${esc(safe(it.url))}" target="_blank" rel="noopener">Đọc bài gốc · ${esc(it.source||"Nguồn")}</a></div></li>`).join("");
  $("items").querySelectorAll(".pic img").forEach(img=>img.addEventListener("error",()=>{const box=img.parentElement;box.outerHTML=fig(sh[+box.dataset.i])}));
  $("end").hidden=!sh.length;
}
fetch("data/editions.json?t="+Date.now()).then(r=>r.json()).then(j=>{const e=(j.editions||[]).filter(x=>Array.isArray(x.items))[0];items=e?e.items:[];render()})
  .catch(()=>{$("empty").hidden=false;$("empty").textContent="Không tải được bản tin. Thử mở lại trang."});
</script>
</body>
</html>
